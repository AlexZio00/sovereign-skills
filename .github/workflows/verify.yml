name: Verify Marketplace Integrity

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Least-privilege token: jobs only read the repo unless a job asks for more.
permissions:
  contents: read

jobs:
  verify-marketplace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify marketplace.json <-> plugin.json <-> directory <-> SKILL.md consistency
        run: python3 scripts/verify_marketplace.py

  secrets-scan:
    runs-on: ubuntu-latest
    # gitleaks-action uses the token to comment on PRs (README); comments need pull-requests: write.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks secrets scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
